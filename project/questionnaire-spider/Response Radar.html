<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Response Radar</title>
<style>
/* layout: paste panel stacked above a centered radar chart with a control rail beside it */
:root{
  --bg:#f7f5f0;
  --panel:#ffffff;
  --ink:#1f2420;
  --muted:#6b7268;
  --line:#dcd8cc;
  --accent:#3d6b5c;
  --accent-soft:#bfe0d4;
  --best:#c98a3b;
  --avg:#5b5f8a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181a;
    --panel:#1e2225;
    --ink:#e8e6df;
    --muted:#9aa29a;
    --line:#32383a;
    --accent:#5fa98e;
    --accent-soft:#2a473d;
    --best:#e0a85f;
    --avg:#8d92c9;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15181a;
  --panel:#1e2225;
  --ink:#e8e6df;
  --muted:#9aa29a;
  --line:#32383a;
  --accent:#5fa98e;
  --accent-soft:#2a473d;
  --best:#e0a85f;
  --avg:#8d92c9;
  color-scheme: dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:28px 48px;
}
.wrap{max-width:1100px;margin:0 auto}
h1{
  font-family:"Fraunces", Georgia, serif;
  font-weight:600;
  font-size:clamp(1.5rem,3vw,2.1rem);
  margin:0 0 4px;
  text-wrap:balance;
}
.sub{color:var(--muted);margin:0 0 24px;font-size:.95rem;max-width:62ch}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:20px;
}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;margin-top:20px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}

label{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:6px}
textarea{
  width:100%;min-height:220px;resize:vertical;
  font-family:ui-monospace,Consolas,monospace;font-size:.85rem;
  background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;
  padding:10px;min-width:0;
}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:14px}
.field{display:flex;flex-direction:column;min-width:120px}
input[type=number]{
  background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;
  padding:7px 9px;font-size:.9rem;width:100px;
}
button{
  background:var(--accent);color:#fff;border:none;border-radius:7px;
  padding:9px 18px;font-size:.9rem;font-weight:600;cursor:pointer;
}
button:hover{filter:brightness(1.08)}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.hint{color:var(--muted);font-size:.8rem;margin-top:8px}
.err{color:#b5503f;font-size:.85rem;margin-top:8px;min-height:1em}

.chart-card{display:flex;flex-direction:column;align-items:center}
.chart-wrap{position:relative;width:100%;max-width:520px;aspect-ratio:1/1}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:14px;justify-content:center;font-size:.82rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:11px;height:11px;border-radius:3px;display:inline-block}
.people-list{margin-top:18px;width:100%}
.people-list h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.78rem;
  cursor:pointer;background:var(--bg);color:var(--ink);
}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}

table.preview{width:100%;border-collapse:collapse;margin-top:14px;font-size:.8rem}
table.preview th,table.preview td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
table.preview{font-variant-numeric:tabular-nums}
</style>

<div class="wrap">
  <h1>Response Radar</h1>
  <p class="sub">Paste your questionnaire table from Excel — one row per person, one column per question — and plot everyone's answers against the best possible score and the group average.</p>

  <div class="card">
    <label for="paste">Paste table (copy the range in Excel, including the header row, then paste here)</label>
    <textarea id="paste" spellcheck="false"></textarea>
    <div class="row">
      <div class="field">
        <label for="bestVal">Best possible answer</label>
        <input type="number" id="bestVal" value="5" step="0.5" min="0">
      </div>
      <div class="field">
        <label for="minVal">Axis min</label>
        <input type="number" id="minVal" value="0" step="0.5">
      </div>
      <div class="field">
        <label for="maxVal">Axis max</label>
        <input type="number" id="maxVal" value="5" step="0.5">
      </div>
      <button id="plotBtn" type="button">Plot</button>
      <button id="sampleBtn" type="button" class="ghost">Load sample</button>
    </div>
    <div class="err" id="err"></div>
    <div id="previewHolder"></div>
  </div>

  <div class="grid">
    <div class="card chart-card">
      <div class="chart-wrap"><canvas id="radar"></canvas></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card">
      <div class="people-list">
        <h3>Show / hide individual people</h3>
        <div class="chips" id="peopleChips"></div>
      </div>
      <div class="people-list">
        <h3>Questions detected</h3>
        <table class="preview" id="qTable"></table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function(){
  var SAMPLE = "Name\tClarity\tUsefulness\tEase of use\tResponsiveness\tValue\tOverall\n" +
    "Alex\t4\t3.5\t4.5\t3\t4\t4\n" +
    "Bo\t3\t4\t3\t4.5\t3.5\t3.5\n" +
    "Chen\t5\t4.5\t4\t4\t4.5\t4.5\n" +
    "Dana\t2.5\t3\t3.5\t3\t2.5\t3\n" +
    "Eli\t4\t4\t3\t3.5\t4\t3.5";

  var paste = document.getElementById('paste');
  var errEl = document.getElementById('err');
  var chart = null;
  var hidden = new Set();

  function parseTable(text){
    var lines = text.replace(/\r/g,'').split('\n').filter(function(l){return l.trim().length>0});
    if(lines.length < 2) throw new Error('Paste at least a header row and one person’s row.');
    var splitRow = function(l){
      return l.indexOf('\t') >= 0 ? l.split('\t') : l.split(/,|\s{2,}/);
    };
    var header = splitRow(lines[0]).map(function(h){return h.trim()});
    var questions = header.slice(1);
    if(questions.length < 1) throw new Error('Could not find question columns — make sure the header row has a name column plus one column per question.');
    var people = [];
    for(var i=1;i<lines.length;i++){
      var cells = splitRow(lines[i]);
      if(cells.length < 2) continue;
      var name = cells[0].trim();
      var vals = questions.map(function(_,qi){
        var raw = (cells[qi+1]||'').trim().replace(',', '.');
        var n = parseFloat(raw);
        return isNaN(n) ? null : n;
      });
      people.push({name: name || ('Row '+i), values: vals});
    }
    if(people.length === 0) throw new Error('No data rows found under the header.');
    return {questions: questions, people: people};
  }

  function average(people, qi){
    var sum=0, n=0;
    people.forEach(function(p){ if(p.values[qi]!=null){sum+=p.values[qi]; n++;} });
    return n ? Math.round((sum/n)*100)/100 : null;
  }

  var palette = ['#3d6b5c','#a1562f','#5b5f8a','#8a4f6b','#3f7a9e','#9a8a2f','#6b4f9a','#2f8a6f'];

  function render(data, best, min, max){
    var ctx = document.getElementById('radar').getContext('2d');
    var datasets = data.people.map(function(p, idx){
      var color = palette[idx % palette.length];
      return {
        label: p.name,
        data: p.values,
        borderColor: color,
        backgroundColor: color + '22',
        pointBackgroundColor: color,
        borderWidth: 2,
        hidden: hidden.has(p.name)
      };
    });
    datasets.push({
      label: 'Best possible',
      data: data.questions.map(function(){return best}),
      borderColor: getComputedStyle(document.documentElement).getPropertyValue('--best').trim(),
      backgroundColor: 'transparent',
      borderDash: [6,4],
      borderWidth: 2,
      pointRadius: 0
    });
    datasets.push({
      label: 'Average',
      data: data.questions.map(function(_,qi){return average(data.people, qi)}),
      borderColor: getComputedStyle(document.documentElement).getPropertyValue('--avg').trim(),
      backgroundColor: 'transparent',
      borderDash: [2,3],
      borderWidth: 2.5,
      pointRadius: 2
    });

    var inkColor = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
    var lineColor = getComputedStyle(document.documentElement).getPropertyValue('--line').trim();

    if(chart) chart.destroy();
    chart = new Chart(ctx, {
      type: 'radar',
      data: { labels: data.questions, datasets: datasets },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        scales: {
          r: {
            min: min, max: max, ticks: { stepSize: 0.5, color: inkColor, backdropColor: 'transparent' },
            grid: { color: lineColor },
            angleLines: { color: lineColor },
            pointLabels: { color: inkColor, font: { size: 12 } }
          }
        },
        plugins: { legend: { display: false } }
      }
    });

    var legend = document.getElementById('legend');
    legend.innerHTML = '';
    datasets.forEach(function(d){
      var span = document.createElement('span');
      var sw = document.createElement('span');
      sw.className = 'swatch';
      sw.style.background = d.borderColor;
      span.appendChild(sw);
      span.appendChild(document.createTextNode(d.label));
      legend.appendChild(span);
    });

    var chips = document.getElementById('peopleChips');
    chips.innerHTML = '';
    data.people.forEach(function(p){
      var chip = document.createElement('button');
      chip.className = 'chip';
      chip.type = 'button';
      chip.textContent = p.name;
      chip.setAttribute('aria-pressed', !hidden.has(p.name));
      chip.addEventListener('click', function(){
        if(hidden.has(p.name)){ hidden.delete(p.name); } else { hidden.add(p.name); }
        chip.setAttribute('aria-pressed', !hidden.has(p.name));
        var ds = chart.data.datasets.find(function(d){return d.label===p.name});
        if(ds){ ds.hidden = !ds.hidden; chart.update(); }
      });
      chips.appendChild(chip);
    });

    var qTable = document.getElementById('qTable');
    var rows = '<tr><th>Question</th><th>Average</th><th>Best</th></tr>';
    data.questions.forEach(function(q, qi){
      rows += '<tr><td>'+q+'</td><td>'+average(data.people, qi)+'</td><td>'+best+'</td></tr>';
    });
    qTable.innerHTML = rows;
  }

  function doPlot(){
    errEl.textContent = '';
    try{
      var data = parseTable(paste.value);
      var best = parseFloat(document.getElementById('bestVal').value);
      var min = parseFloat(document.getElementById('minVal').value);
      var max = parseFloat(document.getElementById('maxVal').value);
      hidden.clear();
      render(data, best, min, max);
    }catch(e){
      errEl.textContent = e.message;
    }
  }

  document.getElementById('plotBtn').addEventListener('click', doPlot);
  document.getElementById('sampleBtn').addEventListener('click', function(){
    paste.value = SAMPLE;
    doPlot();
  });
  ['bestVal','minVal','maxVal'].forEach(function(id){
    document.getElementById(id).addEventListener('change', function(){
      if(chart) doPlot();
    });
  });

  paste.value = SAMPLE;
  doPlot();
})();
</script>

</body></html>
